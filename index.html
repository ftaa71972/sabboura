<head>
<meta charset="utf-8">

<meta name="description" content="سبورة ذكية مجانية للمعلمات: كتابة بالإصبع والقلم، أوراق مسطّرة، صور وPDF، نقاط الطلاب ومؤقت">

<style>
/* Layout: classroom wall — tool rail on the right (RTL), board fills the middle, class roster slides in on the left */
:root{
  --wall:#E9EEF0; --panel:#FFFFFF; --ink:#16323A; --mut:#5E7780; --line:#D3DDE1;
  --accent:#0E7C74; --accent-ink:#FFFFFF; --chalk:#F2C14E; --good:#2E9E5B; --bad:#C8463D;
  --shadow:0 8px 24px rgba(22,50,58,.10);
  --f-ui:"Readex Pro","Segoe UI",Tahoma,sans-serif; --f-title:"Aref Ruqaa","Readex Pro",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wall:#0F1A1E; --panel:#17262C; --ink:#E3EEF0; --mut:#93ABB2; --line:#2A3D44;
  --accent:#2BB3A6; --accent-ink:#06211E; --chalk:#F2C14E; --good:#4CC17E; --bad:#E2675D;
  --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{--wall:#0F1A1E; --panel:#17262C; --ink:#E3EEF0; --mut:#93ABB2; --line:#2A3D44;
  --accent:#2BB3A6; --accent-ink:#06211E; --chalk:#F2C14E; --good:#4CC17E; --bad:#E2675D; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--f-ui);font-size:14px;margin:0;overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px;gap:10px;box-sizing:border-box}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-title);font-size:26px;line-height:1;color:var(--accent);margin-inline-end:auto;white-space:nowrap}
.brand small{font-family:var(--f-ui);font-size:12px;color:var(--mut);margin-inline-start:8px;font-weight:500}
.grp{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
button,select{font-family:inherit;font-size:13px;color:var(--ink);background:transparent;border:0;border-radius:9px;padding:7px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);color:var(--accent-ink)}
button.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
button:disabled{opacity:.4;cursor:default}
select{border:1px solid var(--line);background:var(--panel)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pageno{font-variant-numeric:tabular-nums;min-width:52px;text-align:center;font-weight:600}
main{display:grid;grid-template-columns:auto 1fr auto;gap:10px;min-height:0}
.rail{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:var(--shadow);overflow-y:auto}
.rail button{justify-content:center;width:44px;height:44px;padding:0}
.rail .sep{height:1px;background:var(--line);margin:4px 2px}
.swatches{display:grid;grid-template-columns:repeat(2,20px);gap:6px;justify-content:center;padding:4px 0}
.rail .sw{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.sizes{display:flex;flex-direction:column;align-items:center;gap:4px}
.sizes button{width:44px;height:30px}
.dot{border-radius:50%;background:currentColor;display:block}
#stage{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
#boardWrap{position:relative;box-shadow:var(--shadow);border-radius:14px;overflow:hidden;touch-action:none;background:#fff}
#boardWrap canvas{position:absolute;inset:0;width:100%;height:100%}
#textBox{position:absolute;display:none;min-width:120px;padding:4px 6px;border:2px dashed var(--accent);background:rgba(255,255,255,.85);font-family:var(--f-ui);outline:none;direction:rtl;white-space:pre}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--wall);padding:10px 16px;border-radius:12px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
/* roster */
.roster{width:270px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.roster[hidden]{display:none!important}
.roster h2{font-size:15px;margin:0;padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between}
.roster h2 span{color:var(--mut);font-weight:500;font-size:12px}
.addrow{display:flex;gap:6px;padding:0 12px 10px}
.addrow input{flex:1;min-width:0;font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--wall);color:var(--ink);border-radius:9px;padding:7px 9px}
#students{list-style:none;margin:0;padding:0 8px 8px;overflow-y:auto;flex:1}
#students li{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:4px;padding:6px 6px;border-radius:10px}
#students li.pick{background:color-mix(in srgb,var(--chalk) 35%,transparent)}
#students .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#students .pts{font-variant-numeric:tabular-nums;font-weight:700;min-width:28px;text-align:center;border-radius:8px;padding:2px 4px}
#students .pts.pos{color:var(--good)} #students .pts.neg{color:var(--bad)}
#students button{padding:4px 7px;font-weight:700}
.tools2{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.timer{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--wall);border-radius:10px;padding:6px 8px}
.timer b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.timer.end b{color:var(--bad)}
.picked{grid-column:1/-1;text-align:center;font-family:var(--f-title);font-size:24px;color:var(--accent);min-height:30px}
.example{font-size:11px;color:var(--mut);padding:0 14px 6px}
@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{flex-direction:row;overflow-x:auto;order:2;padding:6px}
  .rail .sep{width:1px;height:auto;margin:2px 4px}
  .swatches{grid-template-columns:repeat(8,20px);align-items:center}
  .sizes{flex-direction:row}
  .roster{position:fixed;inset:auto 0 0 0;width:auto;max-height:60%;border-radius:18px 18px 0 0;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px);margin-inline:max(0px,env(safe-area-inset-left,0px))}
  .brand small{display:none}
}

#app{grid-template-rows:auto 1fr auto}
.share{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px 10px;overflow-x:auto;scrollbar-width:none}
.share::-webkit-scrollbar{display:none}
.share .lbl{font-weight:600;font-size:13px;color:var(--mut);white-space:nowrap;padding-inline-end:4px}
.share a,.share button{display:inline-flex;align-items:center;gap:6px;flex:none;height:36px;padding:0 12px 0 6px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:500;text-decoration:none;cursor:pointer;white-space:nowrap}
.share a:hover,.share button:hover{border-color:var(--accent)}
.share .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;line-height:1}
.share .ic svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:820px){.share .lbl{display:none}.share a,.share button{padding:0 10px 0 5px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}*{box-sizing:border-box}</style>
</head>
<body>
<div id="app" dir="rtl">
  <header>
    <div class="brand">سبورة فتاح التعليمية<small>سبورة ذكية للمعلمة</small></div>
    <div class="grp" role="group" aria-label="الورقة">
      <select id="paper" aria-label="نوع الورقة">
        <option value="plain">ورقة بيضاء</option>
        <option value="ar">مسطّر عربي</option>
        <option value="en">أربع خطوط إنجليزي</option>
        <option value="grid">مربعات رياضيات</option>
        <option value="chalk">سبورة خضرا</option>
      </select>
    </div>
    <div class="grp" role="group" aria-label="الصفحات">
      <button id="prevP" title="الصفحة السابقة" aria-label="الصفحة السابقة"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <span class="pageno" id="pageNo">1 / 1</span>
      <button id="nextP" title="الصفحة التالية" aria-label="الصفحة التالية"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button id="addP" title="صفحة جديدة"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>صفحة</button>
    </div>
    <div class="grp" role="group" aria-label="رفع">
      <button id="upImg"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>صورة</button>
      <button id="upPdf"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>PDF</button>
      <input type="file" id="fImg" accept="image/*" hidden>
      <input type="file" id="fPdf" accept="application/pdf" hidden>
    </div>
    <div class="grp">
      <button id="undo" title="تراجع" aria-label="تراجع"><svg class="i" viewBox="0 0 24 24"><path d="M14 7h-5a5 5 0 000 10h7"/><path d="M14 3l4 4-4 4" transform="matrix(-1 0 0 1 28 0)"/></svg></button>
      <button id="redo" title="إعادة" aria-label="إعادة"><svg class="i" viewBox="0 0 24 24"><path d="M10 7h5a5 5 0 010 10H8"/><path d="M10 3L6 7l4 4" transform="matrix(-1 0 0 1 16 0)"/></svg></button>
      <button id="clearBtn" title="مسح الصفحة">مسح الكل</button>
      <button id="rosterBtn" class="on"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0112 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15 20a5 5 0 016-4.5"/></svg>الطلاب</button>
    </div>
  </header>

  <main>
    <nav class="rail" aria-label="أدوات الرسم">
      <button data-tool="pen" class="on" title="قلم" aria-label="قلم"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg></button>
      <button data-tool="marker" title="هايلايتر" aria-label="هايلايتر"><svg class="i" viewBox="0 0 24 24"><path d="M9 15l-4 4h6l1-1"/><path d="M9 15l8-8 3 3-8 8z"/></svg></button>
      <button data-tool="eraser" title="ممحاة" aria-label="ممحاة"><svg class="i" viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M5 15l9-9 5 5-8 8H8z"/></svg></button>
      <button data-tool="line" title="خط مستقيم" aria-label="خط مستقيم"><svg class="i" viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg></button>
      <button data-tool="arrow" title="سهم" aria-label="سهم"><svg class="i" viewBox="0 0 24 24"><path d="M5 19L19 5M19 5h-7M19 5v7"/></svg></button>
      <button data-tool="rect" title="مستطيل" aria-label="مستطيل"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
      <button data-tool="ellipse" title="دائرة" aria-label="دائرة"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
      <button data-tool="text" title="كتابة نص" aria-label="كتابة نص"><svg class="i" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
      <button data-tool="move" title="تحريك الصور" aria-label="تحريك الصور"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></button>
      <div class="sep"></div>
      <div class="swatches" id="swatches"></div>
      <div class="sep"></div>
      <div class="sizes" id="sizes"></div>
    </nav>

    <div id="stage">
      <div id="boardWrap">
        <canvas id="cBg"></canvas>
        <canvas id="cInk"></canvas>
        <canvas id="cLive"></canvas>
        <div id="textBox" contenteditable="true" aria-label="نص على السبورة"></div>
      </div>
    </div>

    <aside class="roster" id="roster" aria-label="الطلاب">
      <h2>طلاب الفصل <span id="countLbl"></span></h2>
      <div class="example" id="exampleNote">ما فيه طلاب للحين. اكتبي اسم الطالب واضغطي «إضافة».</div>
      <form class="addrow" id="addForm">
        <input id="newName" placeholder="اسم الطالب" autocomplete="off">
        <button class="primary" type="submit">إضافة</button>
      </form>
      <ul id="students"></ul>
      <div class="tools2">
        <div class="picked" id="picked" aria-live="polite"></div>
        <button class="primary" id="pickBtn">اختيار عشوائي</button>
        <button id="resetPts">تصفير النقاط</button>
        <div class="timer" id="timerBox">
          <b id="timerLbl">03:00</b>
          <div style="display:flex;gap:2px">
            <button data-min="1">1د</button><button data-min="3">3د</button><button data-min="5">5د</button>
            <button id="timerGo" aria-label="تشغيل المؤقت">▶</button>
          </div>
        </div>
      </div>
    </aside>
  </main>
<nav class="share" id="shareBar" aria-label="شارك السبورة"><span class="lbl">اربطها وشاركها:</span><button type="button" data-s="install" style="border-color:var(--accent)"><span class="ic" style="background:var(--accent)"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg></span>ثبّت التطبيق</button><a data-s="teams" href="#" target="_blank" rel="noopener"><span class="ic" style="background:#5B5FC7">T</span>Teams</a><a data-s="zoom" href="#" target="_blank" rel="noopener"><span class="ic" style="background:#2D8CFF"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="10" rx="2"/><path d="M15 11l6-3v8l-6-3"/></svg></span>Zoom</a><a data-s="meet" href="#" target="_blank" rel="noopener"><span class="ic" style="background:#00897B"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="10" rx="2"/><path d="M15 11l6-3v8l-6-3"/></svg></span>Google Meet</a><a data-s="classroom" href="#" target="_blank" rel="noopener"><span class="ic" style="background:#1E8E3E"><svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg></span>Classroom</a><a data-s="whatsapp" href="#" target="_blank" rel="noopener"><span class="ic" style="background:#25D366"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></span>واتساب</a><a data-s="telegram" href="#" target="_blank" rel="noopener"><span class="ic" style="background:#229ED9"><svg viewBox="0 0 24 24"><path d="M21 3L3 11l7 3 3 7z"/><path d="M10 14l11-11"/></svg></span>تيليجرام</a><a data-s="email" href="#" target="_blank" rel="noopener"><span class="ic" style="background:#6B7280"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>إيميل</a><button type="button" data-s="copy"><span class="ic" style="background:#0E7C74"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 006 0l3-3a4 4 0 00-6-6l-1 1"/><path d="M14 10a4 4 0 00-6 0l-3 3a4 4 0 006 6l1-1"/></svg></span>نسخ الرابط</button><button type="button" data-s="native"><span class="ic" style="background:#16323A"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg></span>مشاركة</button></nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(()=>{
const W=1600,H=1000; // board world size (16:10)
const $=id=>document.getElementById(id);
const wrap=$('boardWrap'),cBg=$('cBg'),cInk=$('cInk'),cLive=$('cLive'),tb=$('textBox');
const gBg=cBg.getContext('2d'),gInk=cInk.getContext('2d'),gLive=cLive.getContext('2d');
const COLORS=['#16323A','#1D5FD0','#D3352B','#1E8E4E','#E08A12','#7B3FC4','#FFFFFF','#F2C14E'];
const SIZES=[3,6,12,24];
let tool='pen',color=COLORS[0],size=6,paper='ar';
let pages=[{items:[],paper:'ar'}],cur=0,undoS=[[]],redoS=[[]];
let scale=1,dpr=Math.min(window.devicePixelRatio||1,2);
const imgCache=new Map();

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1800);}
function save(){try{localStorage.setItem('sabboura.v1',JSON.stringify({pages,cur,students}));}catch(e){}}

/* ---------- layout ---------- */
function fit(){const st=$('stage').getBoundingClientRect();let w=st.width,h=w*H/W;if(h>st.height){h=st.height;w=h*W/H;}
  w=Math.max(200,Math.floor(w));h=Math.floor(w*H/W);wrap.style.width=w+'px';wrap.style.height=h+'px';scale=w/W;
  [cBg,cInk,cLive].forEach(c=>{c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);});render();}
new ResizeObserver(fit).observe($('stage'));

/* ---------- paper ---------- */
function drawPaper(g,kind){g.save();
  if(kind==='chalk'){g.fillStyle='#1F4D3A';g.fillRect(0,0,W,H);g.strokeStyle='rgba(255,255,255,.04)';for(let i=0;i<60;i++){g.beginPath();g.moveTo(Math.random()*W,Math.random()*H);g.lineTo(Math.random()*W,Math.random()*H);g.stroke();}g.restore();return;}
  g.fillStyle='#FFFFFF';g.fillRect(0,0,W,H);
  if(kind==='ar'){g.strokeStyle='#B9D3F0';g.lineWidth=2;for(let y=120;y<H;y+=70){g.beginPath();g.moveTo(40,y);g.lineTo(W-40,y);g.stroke();}
    g.strokeStyle='#F0A9A4';g.beginPath();g.moveTo(W-120,40);g.lineTo(W-120,H-20);g.stroke();}
  if(kind==='en'){for(let y=110;y<H-60;y+=130){[[0,'#7FA7D9',2],[30,'#D7E3F2',1.5],[60,'#D3352B',2],[90,'#7FA7D9',2]].forEach(([o,c,w])=>{g.strokeStyle=c;g.lineWidth=w;if(o===30){g.setLineDash([10,10]);}else g.setLineDash([]);g.beginPath();g.moveTo(40,y+o);g.lineTo(W-40,y+o);g.stroke();});}g.setLineDash([]);}
  if(kind==='grid'){g.strokeStyle='#DCE6EE';g.lineWidth=1;for(let x=0;x<=W;x+=40){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}for(let y=0;y<=H;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}

/* ---------- render ---------- */
function setT(g){g.setTransform(dpr*scale,0,0,dpr*scale,0,0);}
function getImg(src){let im=imgCache.get(src);if(!im){im=new Image();im.onload=()=>render();im.src=src;imgCache.set(src,im);}return im;}
function drawItem(g,it){g.save();
  if(it.t==='stroke'){g.globalCompositeOperation=it.tool==='eraser'?'destination-out':'source-over';g.globalAlpha=it.tool==='marker'?0.35:1;
    g.strokeStyle=it.c;g.lineCap='round';g.lineJoin='round';const p=it.p;
    if(p.length===1){g.fillStyle=it.c;g.beginPath();g.arc(p[0][0],p[0][1],it.s/2,0,7);g.fill();}
    else{g.lineWidth=it.s;g.beginPath();g.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;g.quadraticCurveTo(p[i][0],p[i][1],mx,my);}const l=p[p.length-1];g.lineTo(l[0],l[1]);g.stroke();}}
  else if(it.t==='shape'){g.strokeStyle=it.c;g.lineWidth=it.s;g.lineCap='round';g.lineJoin='round';const [x1,y1,x2,y2]=it.r;g.beginPath();
    if(it.k==='line'||it.k==='arrow'){g.moveTo(x1,y1);g.lineTo(x2,y2);if(it.k==='arrow'){const a=Math.atan2(y2-y1,x2-x1),L=18+it.s*2;g.moveTo(x2,y2);g.lineTo(x2-L*Math.cos(a-0.45),y2-L*Math.sin(a-0.45));g.moveTo(x2,y2);g.lineTo(x2-L*Math.cos(a+0.45),y2-L*Math.sin(a+0.45));}}
    else if(it.k==='rect'){g.rect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1));}
    else if(it.k==='ellipse'){g.ellipse((x1+x2)/2,(y1+y2)/2,Math.abs(x2-x1)/2||1,Math.abs(y2-y1)/2||1,0,0,7);}
    g.stroke();}
  else if(it.t==='text'){g.fillStyle=it.c;g.font=`600 ${it.s}px "Readex Pro",Tahoma,sans-serif`;g.textAlign='right';g.textBaseline='top';g.direction='rtl';
    it.v.split('\n').forEach((ln,i)=>g.fillText(ln,it.x,it.y+i*it.s*1.3));}
  g.restore();}
function render(){const pg=pages[cur];
  setT(gBg);gBg.clearRect(0,0,W,H);drawPaper(gBg,pg.paper);
  pg.items.filter(i=>i.t==='img').forEach(it=>{const im=getImg(it.src);if(im.complete&&im.naturalWidth){gBg.drawImage(im,it.x,it.y,it.w,it.h);
    if(tool==='move'){gBg.save();gBg.strokeStyle='#0E7C74';gBg.setLineDash([10,8]);gBg.lineWidth=3;gBg.strokeRect(it.x,it.y,it.w,it.h);gBg.setLineDash([]);gBg.fillStyle='#0E7C74';gBg.fillRect(it.x+it.w-14,it.y+it.h-14,28,28);gBg.restore();}}});
  setT(gInk);gInk.clearRect(0,0,W,H);pg.items.filter(i=>i.t!=='img').forEach(it=>drawItem(gInk,it));
  setT(gLive);gLive.clearRect(0,0,W,H);

  $('undo').disabled=!undoS[cur]||!undoS[cur].length;$('redo').disabled=!redoS[cur]||!redoS[cur].length;

  if(tool==='text'){openText(p);return;}

    if(hit){commit();const corner=p[0]>hit.x+hit.w-40&&p[1]>hit.y+hit.h-40;moving={it:hit,dx:p[0]-hit.x,dy:p[1]-hit.y,resize:corner,ar:hit.w/hit.h};}return;}
  const w=(tool==='eraser'?size*3:tool==='marker'?size*3:size)*(e.pointerType==='pen'&&e.pressure?0.6+e.pressure*0.8:1);
  if(['line','arrow','rect','ellipse'].includes(tool))drawing={t:'shape',k:tool,c:color,s:size,r:[p[0],p[1],p[0],p[1]]};
  else drawing={t:'stroke',tool,c:paperInk(color),s:Math.round(w*10)/10,p:[[Math.round(p[0]),Math.round(p[1])]]};

function live(){setT(gLive);gLive.clearRect(0,0,W,H);if(!drawing)return;

  a.addEventListener('click',()=>{if(COPYFIRST[k]){copy().then(ok=>toast(ok?COPYFIRST[k]:'الرابط: '+URLX));}});});
bar.querySelector('[data-s="copy"]').addEventListener('click',async()=>{toast(await copy()?'نسخنا رابط السبورة ✓':'الرابط: '+URLX);});
const nb=bar.querySelector('[data-s="native"]');
if(!navigator.share){nb.style.display='none';}else nb.addEventListener('click',()=>{navigator.share({title:TXT,text:TXT,url:URLX}).catch(()=>{});});
const ib=bar.querySelector('[data-s="install"]');let dp=null;
if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)ib.style.display='none';
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;});
addEventListener('appinstalled',()=>{ib.style.display='none';toast('تم تثبيت السبورة ✓');});
ib.addEventListener('click',async()=>{if(dp){dp.prompt();try{await dp.userChoice;}catch(_){}dp=null;return;}
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  toast(ios?'بالسفاري: اضغط زر المشاركة ⬆️ وبعدين «إضافة إلى الشاشة الرئيسية»':'من قائمة المتصفح ⋮ اختار «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»');
  clearTimeout(toast.h);toast.h=setTimeout(()=>$('toast').classList.remove('show'),6000);});
})();

})();
</script>
